<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>토닥토닥 — TDS 적용 v1</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
/* ============================================================
   TDS tokens — design.md(토스) 기준 그대로 인용
   ============================================================ */
:root{
  /* brand */
  --blue-500: oklch(0.624 0.176 254);
  --blue-600: oklch(0.522 0.176 257);
  --blue-700: oklch(0.476 0.174 259);
  --blue-50:  oklch(0.965 0.020 250);
  /* greyscale (cool-blue tinted) */
  --grey-900: oklch(0.234 0.030 254);
  --grey-800: oklch(0.342 0.030 253);
  --grey-700: oklch(0.452 0.028 253);
  --grey-600: oklch(0.555 0.022 253);
  --grey-500: oklch(0.652 0.020 252);
  --grey-400: oklch(0.752 0.016 251);
  --grey-300: oklch(0.840 0.012 248);
  --grey-200: oklch(0.913 0.008 247);
  --grey-100: oklch(0.957 0.005 247);
  --grey-50:  oklch(0.978 0.003 247);
  --white: #fff;
  /* semantic */
  --red-500:    oklch(0.628 0.218 22);
  --green-500:  oklch(0.493 0.143 154);
  --orange-500: oklch(0.748 0.183 56);
  --yellow-500: oklch(0.853 0.156 86);
  --yellow-300: oklch(0.901 0.124 84);
  --orange-300: oklch(0.870 0.078 51);
  /* alpha */
  --fg-tertiary:   oklch(0.155 0.060 261 / 0.58);
  --fg-quaternary: oklch(0.155 0.060 261 / 0.28);
  --line-subtle:   oklch(0 0 0 / 0.08);
  --bg-overlay:    oklch(0 0 0 / 0.56);
  --press-overlay: oklch(0 0 0 / 0.26);
  --disabled-opacity: 0.30;
  /* semantic alias */
  --fill-brand: var(--blue-500);
  --fill-secondary: var(--grey-100);
  --text-primary: var(--grey-900);
  --text-secondary: var(--grey-700);
  --text-brand: var(--blue-500);
  --border-secondary: var(--grey-200);
  /* radius ladder */
  --r-s:8px; --r-m:12px; --r-l:14px; --r-xl:16px; --r-2xl:20px; --r-3xl:24px; --r-4xl:32px; --r-full:999px;
  /* elevation */
  --shadow-2: 0 4px 12px oklch(0.155 0.060 261 / 0.06), 0 1px 2px oklch(0.155 0.060 261 / 0.04);
  --shadow-3: 0 12px 32px oklch(0.155 0.060 261 / 0.10), 0 2px 6px oklch(0.155 0.060 261 / 0.06);
  --shadow-toast: 0 8px 24px oklch(0.155 0.060 261 / 0.16);
  /* motion */
  --ease: cubic-bezier(0.22,0.61,0.36,1);
  --ease-out: cubic-bezier(0.16,1,0.3,1);
  --dur-fast:120ms; --dur-base:200ms; --dur-slow:320ms;
  --phone-w:390px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--grey-100); color:var(--text-primary);
  letter-spacing:-0.005em;
  -webkit-font-smoothing:antialiased;
}

/* ---------- prototype chrome (제품 아님) ---------- */
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
.proto-head{display:flex;align-items:baseline;gap:10px;margin:4px 2px 14px;flex-wrap:wrap}
.proto-head h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-0.01em}
.proto-head span{font-size:12px;color:var(--grey-500);font-weight:500}
.navchips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.navchips::-webkit-scrollbar{display:none}
.navchips button{
  flex:0 0 auto;height:34px;padding:0 13px;border-radius:var(--r-full);
  border:1px solid var(--border-secondary);background:var(--white);
  font-size:13px;font-weight:600;color:var(--text-secondary);cursor:pointer;
  font-family:inherit;letter-spacing:-0.005em;line-height:1;
  transition:background var(--dur-base) var(--ease),color var(--dur-base) var(--ease);
  display:inline-flex;align-items:center;gap:6px;
}
.navchips button em{font-style:normal;font-size:11px;font-weight:600;color:var(--grey-400)}
.navchips button.active{background:var(--grey-900);border-color:var(--grey-900);color:#fff}
.navchips button.active em{color:oklch(1 0 0 / .55)}
.navchips .sep{flex:0 0 auto;align-self:center;font-size:11px;color:var(--grey-400);font-weight:600;padding:0 4px}
.stage{display:flex;justify-content:center}

/* ---------- phone frame ---------- */
.phone{
  width:var(--phone-w);height:844px;background:var(--white);
  border:8px solid oklch(0.20 0.02 254);border-radius:44px;
  box-shadow:var(--shadow-3);overflow:hidden;position:relative;
}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:24px;background:oklch(0.20 0.02 254);border-radius:0 0 16px 16px;z-index:9}

/* ---------- screen scaffold ---------- */
.screen{height:100%;overflow-y:auto;display:flex;flex-direction:column;background:var(--white);scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.body{flex:1;padding:0 24px 8px;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:5;flex:0 0 auto;
  height:56px;margin-top:28px;padding:0 8px;
  display:flex;align-items:center;justify-content:space-between;background:var(--white);
}
.icon-btn{
  width:40px;height:40px;border:0;background:transparent;border-radius:var(--r-m);
  display:grid;place-items:center;cursor:pointer;color:var(--grey-800);
}
.icon-btn svg{width:24px;height:24px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:active{background:var(--grey-100)}
.topbar .ctx{font-size:13px;font-weight:600;color:var(--fg-tertiary);padding:0 12px}

/* ---------- typography (TDS ramp) ---------- */
.h-page{font-size:24px;line-height:1.3;letter-spacing:-0.02em;font-weight:700;margin:8px 0 8px;color:var(--text-primary)}
.lead{font-size:15px;line-height:1.5;letter-spacing:-0.005em;color:var(--text-secondary);margin:0 0 20px;font-weight:400}
.caption{font-size:12px;line-height:1.4;font-weight:500;color:var(--fg-tertiary);margin:10px 0 0}
.section-title{font-size:13px;line-height:1.25;font-weight:600;color:var(--text-secondary);margin:24px 0 10px}
h3{font-size:17px;line-height:1.45;font-weight:600;margin:0 0 6px;letter-spacing:-0.01em}

/* ---------- buttons ---------- */
.btn{
  position:relative;overflow:hidden;isolation:isolate;
  display:flex;align-items:center;justify-content:center;width:100%;
  border:0;cursor:pointer;font-family:inherit;letter-spacing:-0.005em;
  transition:background var(--dur-fast) var(--ease);
}
.btn::after{content:"";position:absolute;inset:0;background:var(--press-overlay);opacity:0;transition:opacity var(--dur-fast) var(--ease)}
.btn:active::after{opacity:1}
.btn-xl{height:56px;border-radius:var(--r-xl);font-size:17px;font-weight:700;line-height:1.25}
.btn-l{height:48px;border-radius:var(--r-l);font-size:17px;font-weight:700;line-height:1.25}
.btn-m{height:40px;border-radius:var(--r-m);font-size:15px;font-weight:600;line-height:1.25}
.btn-primary{background:var(--fill-brand);color:#fff}
.btn-secondary{background:var(--fill-secondary);color:var(--text-primary)}
.btn-ghost{background:transparent;color:var(--text-brand)}
.btn-ghost::after{background:oklch(0 0 0 / 0.06)}
.btn[disabled]{opacity:var(--disabled-opacity);pointer-events:none}
.btn + .btn{margin-top:10px}
.btn-row{display:flex;gap:9px}.btn-row .btn{flex:1}.btn-row .btn+.btn{margin-top:0}

/* bottom CTA — 보호 그라디언트(문서화된 예외 1) */
.cta-bar{
  position:sticky;bottom:0;z-index:6;flex:0 0 auto;
  margin:auto -24px 0;padding:28px 24px 20px;
  background:linear-gradient(180deg, oklch(1 0 0 / 0) 0, var(--white) 26px);
}

/* ---------- cards ---------- */
.card{background:var(--white);border:1px solid var(--border-secondary);border-radius:var(--r-xl);padding:18px;margin:0 0 12px}
.card-soft{background:var(--grey-50);border-color:transparent}
.card-brand{background:var(--blue-50);border-color:transparent}
.mini-title{font-size:13px;line-height:1.25;font-weight:600;color:var(--fg-tertiary);margin:0 0 8px}
.card-brand .mini-title{color:var(--text-brand)}
.body-text{font-size:15px;line-height:1.5;letter-spacing:-0.005em;margin:0;color:var(--text-primary)}
.body-text .dim{color:var(--fg-tertiary);font-size:13px}
.quote{font-size:17px;line-height:1.5;font-weight:600;letter-spacing:-0.01em;margin:0;color:var(--text-primary)}
.big-quote{font-size:20px;line-height:1.45;font-weight:700;letter-spacing:-0.015em;margin:0;color:var(--text-primary)}
.card.tappable{cursor:pointer;transition:background var(--dur-base) var(--ease)}
.card.tappable:active{background:var(--grey-50)}

/* ---------- hero (landing) ---------- */
.hero{
  border-radius:var(--r-3xl);background:var(--grey-50);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:216px;margin:6px 0 22px;
}
.mascot{width:104px;height:104px;border-radius:var(--r-4xl);background:var(--white);border:1px solid var(--border-secondary);display:grid;place-items:center;font-size:52px}
.mascot-title{font-size:13px;color:var(--text-secondary);font-weight:600;margin-top:12px}

/* ---------- entry choices ---------- */
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 8px}
.entry-choice{
  border:1px solid var(--border-secondary);background:var(--white);border-radius:var(--r-2xl);
  padding:18px 16px;min-height:136px;text-align:left;cursor:pointer;font-family:inherit;color:var(--text-primary);
  transition:background var(--dur-base) var(--ease);letter-spacing:-0.005em;
}
.entry-choice:active{background:var(--grey-50)}
.entry-choice b{display:block;font-size:16px;font-weight:700;line-height:1.3;margin-bottom:8px;letter-spacing:-0.01em}
.entry-choice p{font-size:13px;line-height:1.5;color:var(--text-secondary);margin:0;font-weight:400}
.entry-choice .glyph{font-size:22px;display:block;margin-bottom:10px}

/* ---------- chips (34px full pill) ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  height:34px;padding:0 14px;border-radius:var(--r-full);
  border:1px solid var(--border-secondary);background:var(--white);
  font-size:13px;font-weight:600;color:var(--text-secondary);cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;letter-spacing:-0.005em;
  transition:background var(--dur-base) var(--ease),color var(--dur-base) var(--ease),border-color var(--dur-base) var(--ease);
}
.chip.active{background:var(--grey-900);border-color:var(--grey-900);color:#fff}

/* ---------- textarea (text-field 규칙) ---------- */
textarea{
  width:100%;min-height:132px;border:1px solid transparent;border-radius:var(--r-xl);
  background:var(--fill-secondary);padding:16px;font-family:inherit;
  font-size:15px;line-height:1.5;letter-spacing:-0.005em;color:var(--text-primary);
  resize:none;outline:0;transition:border-color var(--dur-base) var(--ease),background var(--dur-base) var(--ease);
}
textarea::placeholder{color:var(--fg-quaternary)}
textarea:focus{background:var(--white);border:1.5px solid var(--blue-500)}

/* ---------- deity list ---------- */
.deity-card{
  display:grid;grid-template-columns:48px 1fr;gap:14px;align-items:start;
  background:var(--white);border:1px solid var(--border-secondary);border-radius:var(--r-2xl);
  padding:16px;margin:0 0 12px;cursor:pointer;transition:background var(--dur-base) var(--ease);
}
.deity-card:active{background:var(--grey-50)}
.symbol{width:48px;height:48px;border-radius:var(--r-l);background:var(--blue-50);display:grid;place-items:center;font-size:24px}
.deity-name{font-size:17px;font-weight:700;letter-spacing:-0.01em;margin-bottom:2px}
.deity-role{font-size:13px;line-height:1.5;color:var(--text-secondary);margin-bottom:10px}
.line-sample{font-size:13px;line-height:1.5;background:var(--grey-50);border-radius:var(--r-m);padding:10px 12px;color:var(--text-secondary)}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 8px}
.badge{height:22px;padding:0 8px;border-radius:6px;background:var(--blue-50);color:var(--text-brand);font-size:11px;font-weight:600;display:inline-flex;align-items:center}
.selected-deity{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--blue-50);border-radius:var(--r-l);padding:12px 14px;margin:2px 0 16px;
}
.selected-deity strong{font-size:13px;font-weight:600;color:var(--text-brand)}
.selected-deity button{border:0;background:transparent;color:var(--text-brand);font-weight:600;font-size:12px;cursor:pointer;font-family:inherit;flex:0 0 auto;opacity:.75}

/* ---------- progress ---------- */
.progress{height:4px;background:var(--grey-200);border-radius:var(--r-full);margin:4px 0 20px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--fill-brand);border-radius:var(--r-full);transition:width var(--dur-slow) var(--ease-out)}

/* ---------- loading (3-dot loader — skeleton shimmer 금지) ---------- */
.dots{display:flex;gap:8px;justify-content:center;margin:44px 0 20px}
.dots i{width:10px;height:10px;border-radius:var(--r-full);background:var(--grey-300);animation:dot 1.2s var(--ease) infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.35;transform:none}30%{opacity:1;transform:translateY(-4px);background:var(--blue-500)}}
.checklist{display:grid;gap:8px;margin:14px 0}
.check{display:flex;gap:10px;align-items:center;background:var(--grey-50);border-radius:var(--r-l);padding:13px 14px;font-size:14px;font-weight:500;color:var(--text-secondary);line-height:1.45}
.check .tick{width:20px;height:20px;border-radius:var(--r-full);background:var(--green-500);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 auto}

/* ---------- talisman art (일러스트 그라디언트 — 문서화된 예외 3) ---------- */
.talisman-art{
  height:250px;border-radius:var(--r-3xl);margin:4px 0 14px;
  background:linear-gradient(145deg,var(--yellow-300),var(--orange-300));
  display:grid;place-items:center;position:relative;overflow:hidden;
}
.talisman-art .frame{
  width:158px;height:192px;background:oklch(1 0 0 / 0.85);border-radius:var(--r-xl);
  display:grid;place-items:center;box-shadow:var(--shadow-2);
}
.talisman-art .frame span{writing-mode:vertical-rl;font-size:16px;font-weight:700;letter-spacing:0.14em;color:var(--grey-800)}

/* ---------- score ---------- */
.score{display:flex;gap:8px;margin-top:12px}
.score button{
  flex:1;height:48px;border-radius:var(--r-m);border:1px solid var(--border-secondary);
  background:var(--white);font-size:15px;font-weight:600;color:var(--text-secondary);cursor:pointer;font-family:inherit;
  transition:background var(--dur-base) var(--ease);
}
.score button.on{background:var(--blue-50);border-color:var(--blue-500);color:var(--text-brand);font-weight:700}

/* ---------- toast ---------- */
.toast{
  position:absolute;bottom:22px;left:20px;right:20px;z-index:20;
  background:var(--grey-900);color:#fff;border-radius:var(--r-l);
  padding:14px 16px;font-size:14px;font-weight:500;line-height:1.45;
  box-shadow:var(--shadow-toast);display:flex;gap:10px;align-items:center;
  opacity:0;transform:translateY(8px);pointer-events:none;
  transition:opacity var(--dur-slow) var(--ease-out),transform var(--dur-slow) var(--ease-out);
}
.toast.show{opacity:1;transform:none}
.toast .tick{width:20px;height:20px;border-radius:var(--r-full);background:var(--green-500);display:grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 auto}

.divider{height:1px;background:var(--border-secondary);margin:24px -24px}
.spacer{flex:1}

@media(max-width:520px){
  .wrap{padding:12px 10px 32px}
  .phone{width:100%;max-width:390px;height:800px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="proto-head"><h1>토닥토닥 · TDS 적용 v1</h1><span>디자인 가이드(토스 design.md) 토큰 그대로 적용 — 390px</span></div>
  <div class="navchips" id="nav"></div>
  <div class="stage">
    <div class="phone">
      <div class="notch"></div>
      <div class="screen" id="screen"></div>
      <div class="toast" id="toast"><span class="tick">✓</span><span id="toastMsg"></span></div>
    </div>
  </div>
</div>

<script>
let appState={selectedDeity:null};
const deityMap={
  seongju:{name:'성주신',label:'성주신에게 고민을 건네고 있어요',symbol:'🏠',role:'관계 안에서 내 자리를 살피는 신'},
  jowang:{name:'조왕신',label:'조왕신과 함께 이 고민을 정리해볼게요',symbol:'🔥',role:'식어버린 일상과 마음의 온도를 다시 데우는 신'},
  samsin:{name:'삼신할미',label:'삼신할미에게 시작 앞의 마음을 건네고 있어요',symbol:'🌱',role:'새로 시작하고 싶은 마음을 조심스럽게 돌보는 신'}
};
const backSvg='<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>';
const homeSvg='<svg viewBox="0 0 24 24"><path d="M3 11.5L12 4l9 7.5"/><path d="M5.5 10v9h13v-9"/></svg>';
function topbar(backGo,ctx,home){return `<div class="topbar">${backGo?`<button class="icon-btn" data-go="${backGo}">${home?homeSvg:backSvg}</button>`:'<span style="width:40px"></span>'}<span class="ctx">${ctx||''}</span></div>`}
function cta(label,go,opts={}){return `<div class="cta-bar"><button class="btn btn-xl btn-primary" ${opts.disabled?'disabled':''} ${go?`data-go="${go}"`:''} ${opts.toast?`data-toast="${opts.toast}"`:''}>${label}</button></div>`}

const screens=[
{id:'landing',title:'시작 화면',group:'main',body:()=>`
  ${topbar(null,'알파 테스트')}
  <div class="body">
    <div class="hero"><div class="mascot">🚪</div><div class="mascot-title">문 앞에서 마음을 맞이하는 토착신</div></div>
    <h2 class="h-page">오늘 마음에<br>걸리는 일이 있나요?</h2>
    <p class="lead">고민을 적으면 토착신이 지금 마음을 읽고, 오늘 해볼 작은 실천을 건네드려요. 원한다면 그 결과를 나만의 부적으로 남길 수 있어요.</p>
    <div class="choice-grid">
      <button class="entry-choice" data-go="input" data-flow="worry"><span class="glyph">✍️</span><b>고민부터 시작하기</b><p>내 이야기를 먼저 적고, 어울리는 토착신의 해석을 받아요.</p></button>
      <button class="entry-choice" data-go="deities"><span class="glyph">🏮</span><b>토착신 먼저 보기</b><p>토착신의 말투와 관점을 보고, 마음에 가까운 신에게 고민을 건네요.</p></button>
    </div>
    <button class="btn btn-m btn-ghost" data-toast="고민 입력 → 토착신 해석 → 오늘 해볼 작은 실천 → 원하면 부적 생성 순서로 진행돼요.">이 서비스는 어떻게 진행되나요?</button>
    <p class="caption" style="text-align:center">미래를 맞히거나 결정을 대신하는 서비스가 아니라, 오늘의 고민을 정리하기 위한 참고예요.</p>
  </div>`},
{id:'deities',title:'토착신 리스트',group:'main',body:()=>`
  ${topbar('landing','토착신 먼저 보기')}
  <div class="body">
    <h2 class="h-page">어떤 토착신에게<br>고민을 건네볼까요?</h2>
    <p class="lead">무엇을 기준으로 고르면 좋을지 먼저 보여드릴게요. 토착신을 골라도 결과 전에는 고민 입력이 필요해요.</p>

function deityCard(id,tags,line){const d=deityMap[id];return `<div class="deity-card" data-go="deityDetail" data-deity="${id}"><div class="symbol">${d.symbol}</div><div><div class="deity-name">${d.name}</div><div class="badges">${tags.split(' · ').map(t=>`<span class="badge">${t}</span>`).join('')}</div><div class="deity-role">${d.role}</div><div class="line-sample">${line}</div></div></div>`}
function sampleLine(id){return{seongju:'“관계를 지키는 일과 나를 지우는 일은 달라요.”',jowang:'“오늘은 큰 불을 피우지 않아도 돼요. 꺼지지 않을 만큼만 데워봐요.”',samsin:'“아가, 처음부터 열매를 보려 하지 말고 씨앗 하나만 손에 쥐어보자.”'}[id]}
function sampleConcerns(id){return{seongju:'“내가 예민한 건지 모르겠어요.”<br>“서운한데 말하면 관계가 어색해질까 봐 못 말하겠어요.”',jowang:'“계속 미루기만 해요.”<br>“생활 리듬이 무너졌는데 다시 시작하기가 어려워요.”',samsin:'“시작하고 싶은데 자꾸 겁나요.”<br>“잘 안 될 것 같아서 계속 미루고 있어요.”'}[id]}
function symbolWords(id){return{seongju:'문지방, 작은 등불, 닫히지 않은 문, 내 마음이 머물 자리',jowang:'작은 불씨, 솥, 따뜻한 김, 꺼지지 않는 온기',samsin:'씨앗, 보따리, 실, 아직 열리지 않은 새싹'}[id]}

const nav=document.getElementById('nav'),screenEl=document.getElementById('screen'),toast=document.getElementById('toast'),toastMsg=document.getElementById('toastMsg');
function renderNav(activeId){
  const main=screens.filter(s=>s.group==='main'),exc=screens.filter(s=>s.group==='exception');
  nav.innerHTML=main.map((s,i)=>`<button class="${s.id===activeId?'active':''}" data-nav="${s.id}"><em>${String(i+1).padStart(2,'0')}</em>${s.title}</button>`).join('')
    +'<span class="sep">예외</span>'
    +exc.map(s=>`<button class="${s.id===activeId?'active':''}" data-nav="${s.id}">${s.title}</button>`).join('');
  nav.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>render(b.getAttribute('data-nav'))));
}
let autoTimer=null;
function render(id='landing'){
  const s=screens.find(x=>x.id===id)||screens[0];
  renderNav(s.id);
  screenEl.innerHTML=s.body();
  screenEl.scrollTop=0;
  wire();
  if(autoTimer){clearTimeout(autoTimer);autoTimer=null}
  const next={loading:'result',talismanLoading:'talisman'}[s.id];
  if(next){autoTimer=setTimeout(()=>render(next),1600)}
}
function showToast(msg){toastMsg.textContent=msg;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),2000)}
function wire(){
  screenEl.querySelectorAll('[data-go],[data-toast]').forEach(el=>{
    el.addEventListener('click',()=>{
      const deity=el.getAttribute('data-deity');if(deity)appState.selectedDeity=deity;
      if(el.getAttribute('data-flow')==='worry')appState.selectedDeity=null;
      const msg=el.getAttribute('data-toast');if(msg)showToast(msg);
      const target=el.getAttribute('data-go');if(target)render(target);
    });
  });
  screenEl.querySelectorAll('.chip').forEach(ch=>ch.addEventListener('click',e=>{e.stopPropagation();ch.classList.toggle('active')}));
  screenEl.querySelectorAll('.score button').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();btn.closest('.score').querySelectorAll('button').forEach(b=>b.classList.remove('on'));btn.classList.add('on')}));
}
render('landing');
</script>
</body>
</html>
