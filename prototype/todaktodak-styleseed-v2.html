<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>토닥토닥 — StyleSeed v2</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   STYLESEED.md lock — warm-paper skin · terracotta #9B5132
   consumer-service grammar · Float motion · soft radius
   ============================================================ */
:root{
  /* surfaces (warm paper) */
  --bg-page:#FAF7F2;
  --bg-card:#FFFFFF;
  --bg-subtle:#F3EEE6;
  /* warm 5-level text ramp — no pure black */
  --text-strong:#2B2521;
  --text-primary:#3D362E;
  --text-secondary:#6F6559;
  --text-tertiary:#9C9184;
  --text-disabled:#C6BCAF;
  /* brand */
  --brand:#9B5132;
  --brand-press:#7F3F27;
  --brand-tint:rgba(155,81,50,.10);
  --brand-tint-strong:rgba(155,81,50,.16);
  /* semantics — destructive kept clearly redder than accent, rare use */
  --destructive:#C33B2B;
  --destructive-tint:rgba(195,59,43,.09);
  --warning:#B97D2A;
  --warning-tint:rgba(185,125,42,.10);
  /* imagery palette (content art only — never UI accents) */
  --img-hanji:#F1E6D4; --img-persimmon:#C97B4A; --img-ink:#4A4038; --img-pine:#6B7F6A;
  /* lines */
  --border:#EAE2D6;
  --border-strong:#D8CDBD;
  /* radius personality: soft */
  --r-ctrl:10px; --r-inner:12px; --r-card:16px;
  /* elevation — one light source, above-left, ≤8-10% */
  --shadow-card:0 1px 3px rgba(0,0,0,.04);
  --shadow-elevated:0 4px 12px rgba(0,0,0,.06);
  --shadow-modal:0 8px 24px rgba(0,0,0,.10);
  /* motion — Float */
  --dur-fast:100ms; --dur:200ms; --dur-slow:350ms;
  --ease:cubic-bezier(.25,.1,.25,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --phone-w:390px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  background:#F1EDE6; color:var(--text-primary);
  letter-spacing:0; /* Korean: no positive tracking */
  -webkit-font-smoothing:antialiased;
}
.serif{font-family:"Noto Serif KR","Apple SD Gothic Neo",serif}

/* ---------- prototype chrome ---------- */
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
.proto-head{display:flex;align-items:baseline;gap:10px;margin:4px 2px 14px;flex-wrap:wrap}
.proto-head h1{font-size:16px;font-weight:700;margin:0;color:var(--text-strong)}
.proto-head span{font-size:12px;color:var(--text-tertiary);font-weight:500}
.navchips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.navchips::-webkit-scrollbar{display:none}
.navchips button{
  flex:0 0 auto;height:36px;padding:0 12px;border-radius:var(--r-ctrl);
  border:1px solid var(--border);background:var(--bg-card);
  font-size:13px;font-weight:600;color:var(--text-secondary);cursor:pointer;
  font-family:inherit;display:inline-flex;align-items:center;gap:6px;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease);
}
.navchips button em{font-style:normal;font-size:11px;font-weight:600;color:var(--text-disabled)}
.navchips button.active{background:var(--text-strong);border-color:var(--text-strong);color:#fff}
.navchips button.active em{color:rgba(255,255,255,.5)}
.navchips .sep{flex:0 0 auto;align-self:center;font-size:11px;color:var(--text-tertiary);font-weight:600;padding:0 4px}
.stage{display:flex;justify-content:center}

/* ---------- phone frame ---------- */
.phone{
  width:var(--phone-w);height:844px;background:var(--bg-page);
  border:8px solid #2A2724;border-radius:44px;
  box-shadow:var(--shadow-modal);overflow:hidden;position:relative;
}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:24px;background:#2A2724;border-radius:0 0 16px 16px;z-index:9}

/* ---------- screen scaffold ---------- */
.screen{height:100%;overflow-y:auto;display:flex;flex-direction:column;background:var(--bg-page);scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.body{flex:1;padding:0 24px 12px;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:5;flex:0 0 auto;
  height:82px;padding:26px 8px 0;
  display:flex;align-items:center;justify-content:space-between;
  background:var(--bg-page);
}
.icon-btn{
  width:44px;height:44px;border:0;background:transparent;border-radius:var(--r-ctrl);
  display:grid;place-items:center;cursor:pointer;color:var(--text-primary);
}
.icon-btn svg{width:22px;height:22px}
.icon-btn:active{background:var(--bg-subtle)}
.topbar .ctx{font-size:13px;font-weight:600;color:var(--text-tertiary);padding:0 12px}

/* Float entrance — gentle, staggered */
.body>*{animation:floatIn var(--dur-slow) var(--ease-out) both}
.body>*:nth-child(2){animation-delay:40ms}
.body>*:nth-child(3){animation-delay:80ms}
.body>*:nth-child(4){animation-delay:120ms}
.body>*:nth-child(5){animation-delay:160ms}
.body>*:nth-child(n+6){animation-delay:200ms}
@keyframes floatIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ---------- typography (mobile-tight scale) ---------- */
.h-page{font-size:23px;line-height:1.4;letter-spacing:-.01em;font-weight:700;margin:6px 0 10px;color:var(--text-strong)}
.lead{font-size:15px;line-height:1.62;color:var(--text-secondary);margin:0 0 24px;font-weight:400}
.caption{font-size:12px;line-height:1.55;font-weight:500;color:var(--text-tertiary);margin:10px 0 0}
.field-label{font-size:14px;line-height:1.4;font-weight:600;color:var(--text-primary);margin:28px 0 10px}
h3{font-size:16px;line-height:1.45;font-weight:700;margin:0 0 4px;color:var(--text-strong)}
.icon{width:22px;height:22px;flex:0 0 auto}

/* ---------- buttons — one height set 52/48/44, radius 10 ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  border:0;cursor:pointer;font-family:inherit;border-radius:var(--r-ctrl);
  transition:background var(--dur-fast) var(--ease),transform var(--dur-fast) var(--ease);
}
.btn:focus-visible,.chip:focus-visible,.icon-btn:focus-visible,textarea:focus-visible,.choice:focus-visible,.tap:focus-visible{
  outline:2px solid var(--brand);outline-offset:2px;
}
.btn-cta{height:52px;font-size:16px;font-weight:700}
.btn-l{height:48px;font-size:15px;font-weight:700}
.btn-m{height:44px;font-size:14px;font-weight:600}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:active{background:var(--brand-press)}
.btn-secondary{background:var(--bg-subtle);color:var(--text-primary)}
.btn-secondary:active{background:#EAE3D7}
.btn-ghost{background:transparent;color:var(--brand)}
.btn-ghost:active{background:var(--brand-tint)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn + .btn{margin-top:8px}
.btn-row{display:flex;gap:8px}.btn-row .btn{flex:1}.btn-row .btn+.btn{margin-top:0}

/* sticky CTA (form pattern — allowed on flow screens) */
.cta-bar{
  position:sticky;bottom:0;z-index:6;flex:0 0 auto;
  margin:auto -24px 0;padding:24px 24px 22px;
  background:linear-gradient(180deg,rgba(250,247,242,0) 0,var(--bg-page) 22px);
}

/* ---------- cards ---------- */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-card);padding:16px;box-shadow:var(--shadow-card)}
.card+.card{margin-top:12px}
.card-lg{padding:24px}
.card-tint{background:var(--brand-tint);border-color:transparent;box-shadow:none}
.card-subtle{background:var(--bg-subtle);border-color:transparent;box-shadow:none}
.mini-label{font-size:12px;line-height:1.3;font-weight:600;color:var(--text-tertiary);margin:0 0 8px}
.card-tint .mini-label{color:var(--brand)}
.body-text{font-size:14px;line-height:1.6;margin:0;color:var(--text-primary)}
.body-text .dim{color:var(--text-tertiary);font-size:13px}
.sub-text{font-size:13px;line-height:1.6;margin:0;color:var(--text-secondary)}
/* signature move — deity utterances only */
.deity-quote{font-family:"Noto Serif KR",serif;font-size:19px;line-height:1.65;font-weight:600;margin:0;color:var(--text-strong)}
.deity-quote-lg{font-family:"Noto Serif KR",serif;font-size:21px;line-height:1.62;font-weight:600;margin:0;color:var(--text-strong)}
.gift-sentence{font-size:16px;line-height:1.6;font-weight:700;margin:0;color:var(--text-strong)}
.tap{cursor:pointer;transition:background var(--dur) var(--ease)}
.tap:active{background:var(--bg-subtle)}

/* ---------- icon badge — brand 10% tint + brand stroke icon ---------- */
.ibadge{width:44px;height:44px;border-radius:var(--r-inner);background:var(--brand-tint);color:var(--brand);display:grid;place-items:center;flex:0 0 auto}
.ibadge svg{width:22px;height:22px}
.ibadge-lg{width:64px;height:64px;border-radius:var(--r-card)}
.ibadge-lg svg{width:30px;height:30px}
.ibadge-neutral{background:var(--bg-subtle);color:var(--text-secondary)}

/* ---------- hero (landing) ---------- */
.hero{
  border-radius:var(--r-card);background:var(--bg-subtle);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 24px 24px;margin:4px 0 24px;
}
.hero-title{font-size:13px;color:var(--text-secondary);font-weight:600;margin-top:16px}

/* ---------- entry choices ---------- */
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 8px}
.choice{
  border:1px solid var(--border);background:var(--bg-card);border-radius:var(--r-card);
  padding:16px;min-height:150px;text-align:left;cursor:pointer;font-family:inherit;color:var(--text-primary);
  box-shadow:var(--shadow-card);display:flex;flex-direction:column;align-items:flex-start;gap:0;
  transition:background var(--dur) var(--ease);
}
.choice:active{background:var(--bg-subtle)}
.choice .ibadge{width:40px;height:40px;margin-bottom:12px}
.choice .ibadge svg{width:20px;height:20px}
.choice b{display:block;font-size:15px;font-weight:700;line-height:1.35;margin-bottom:6px;color:var(--text-strong)}
.choice p{font-size:12.5px;line-height:1.55;color:var(--text-secondary);margin:0;font-weight:400}

/* ---------- chips — soft radius (one personality), ≥44px targets ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  min-height:44px;padding:10px 16px;border-radius:var(--r-ctrl);
  border:1px solid var(--border);background:var(--bg-card);
  font-size:14px;font-weight:500;color:var(--text-secondary);cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease),border-color var(--dur) var(--ease);
}
.chip.active{background:var(--brand-tint);border-color:var(--brand);color:var(--brand);font-weight:600}

/* ---------- textarea ---------- */
textarea{
  width:100%;min-height:140px;border:1px solid var(--border);border-radius:var(--r-inner);
  background:var(--bg-card);padding:16px;font-family:inherit;
  font-size:15px;line-height:1.62;color:var(--text-primary);
  resize:none;outline:0;transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease);
}
textarea::placeholder{color:var(--text-disabled)}
textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-tint)}

/* ---------- deity list ---------- */
.deity-card{
  display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-card);
  padding:16px;box-shadow:var(--shadow-card);cursor:pointer;
  transition:background var(--dur) var(--ease);
}
.deity-card+.deity-card{margin-top:12px}
.deity-card:active{background:var(--bg-subtle)}
.deity-name{font-size:16px;font-weight:700;color:var(--text-strong);margin-bottom:2px}
.deity-fit{font-size:12px;line-height:1.5;color:var(--text-tertiary);font-weight:500;margin-bottom:4px}
.deity-role{font-size:13px;line-height:1.55;color:var(--text-secondary);margin-bottom:12px}
.line-sample{font-family:"Noto Serif KR",serif;font-size:14px;line-height:1.7;font-weight:500;background:var(--bg-subtle);border-radius:var(--r-inner);padding:12px 14px;color:var(--text-primary)}
.selected-deity{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--brand-tint);border-radius:var(--r-inner);padding:12px 14px;margin:0 0 16px;
}
.selected-deity strong{font-size:13px;font-weight:600;color:var(--brand)}
.selected-deity button{border:0;background:transparent;color:var(--brand);font-weight:600;font-size:12px;cursor:pointer;font-family:inherit;flex:0 0 auto;opacity:.8;min-height:44px}

/* ---------- progress ---------- */
.progress{height:4px;background:var(--bg-subtle);border-radius:999px;margin:2px 0 24px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width var(--dur-slow) var(--ease-out)}

/* ---------- loading — 3-dot, gentle (Float) ---------- */
.dots{display:flex;gap:8px;justify-content:center;margin:52px 0 24px}
.dots i{width:9px;height:9px;border-radius:999px;background:var(--border-strong);animation:dot 1.4s var(--ease) infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes dot{0%,60%,100%{opacity:.4;transform:none}30%{opacity:1;transform:translateY(-3px);background:var(--brand)}}
.checklist{display:grid;gap:8px;margin:16px 0 0}
.check{display:flex;gap:10px;align-items:center;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-inner);padding:13px 14px;font-size:14px;font-weight:500;color:var(--text-secondary)}
.check .tick{width:20px;height:20px;border-radius:999px;background:var(--brand-tint);color:var(--brand);display:grid;place-items:center;flex:0 0 auto}
.check .tick svg{width:12px;height:12px}

/* ---------- talisman art (content illustration — imagery palette only) ---------- */
.talisman-art{
  border-radius:var(--r-card);background:var(--img-hanji);
  display:grid;place-items:center;padding:28px 0;margin:0 0 12px;
}

/* ---------- score ---------- */
.score{display:flex;gap:8px;margin-top:12px}
.score button{
  flex:1;height:48px;border-radius:var(--r-ctrl);border:1px solid var(--border);
  background:var(--bg-card);font-size:15px;font-weight:600;color:var(--text-secondary);cursor:pointer;font-family:inherit;
  transition:background var(--dur) var(--ease);
}
.score button.on{background:var(--brand-tint);border-color:var(--brand);color:var(--brand);font-weight:700}

/* ---------- toast ---------- */
.toast{
  position:absolute;bottom:22px;left:20px;right:20px;z-index:20;
  background:#332D27;color:#fff;border-radius:var(--r-inner);
  padding:14px 16px;font-size:14px;font-weight:500;line-height:1.5;
  box-shadow:var(--shadow-modal);display:flex;gap:10px;align-items:center;
  opacity:0;transform:translateY(8px);pointer-events:none;
  transition:opacity var(--dur-slow) var(--ease-out),transform var(--dur-slow) var(--ease-out);
}
.toast.show{opacity:1;transform:none}
.toast svg{width:18px;height:18px;flex:0 0 auto;color:#E8C79B}

.spacer{flex:1}
.gap-32{height:32px;flex:0 0 auto}

@media(max-width:520px){
  .wrap{padding:12px 10px 32px}
  .phone{width:100%;max-width:390px;height:800px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="proto-head"><h1>토닥토닥 · StyleSeed v2</h1><span>consumer-service × warm-paper · terracotta lock — 390px</span></div>
  <div class="navchips" id="nav"></div>
  <div class="stage">
    <div class="phone">
      <div class="notch"></div>
      <div class="screen" id="screen"></div>
      <div class="toast" id="toast" role="status"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span id="toastMsg"></span></div>
    </div>
  </div>
</div>

<script>
/* ---------- one line-icon family: 24 grid · 1.8 stroke · round caps · currentColor ---------- */
const I=(p,vb='0 0 24 24')=>`<svg class="icon" viewBox="${vb}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICONS={
  back:I('<path d="M14.5 5.5L8 12l6.5 6.5"/>'),
  home:I('<path d="M4 11l8-7 8 7"/><path d="M6 9.8V20h12V9.8"/><path d="M10 20v-5h4v5"/>'),
  door:I('<path d="M6 20V5.5a1.5 1.5 0 0 1 1.5-1.5h9A1.5 1.5 0 0 1 18 5.5V20"/><path d="M4 20h16"/><circle cx="14.6" cy="12.2" r="0.9" fill="currentColor" stroke="none"/>'),
  house:I('<path d="M4 11l8-7 8 7"/><path d="M6 9.8V20h12V9.8"/><path d="M10 20v-5h4v5"/>'),
  flame:I('<path d="M12 3.5c1.6 2.6 5.5 5 5.5 9.3A5.5 5.5 0 0 1 12 18.3a5.5 5.5 0 0 1-5.5-5.5c0-2.1 1-3.7 2.2-5.2.4 1 .9 1.7 1.8 2.3-.2-2.5.4-4.6 1.5-6.4z"/>'),
  sprout:I('<path d="M12 20v-7"/><path d="M12 13c0-3.5-2.5-6-6-6 0 3.5 2.5 6 6 6z"/><path d="M12 11c0-2.8 2.2-5 5-5 0 2.8-2.2 5-5 5z"/>'),
  pen:I('<path d="M4 20l1-4L16.5 4.5a1.9 1.9 0 0 1 2.7 0l.3.3a1.9 1.9 0 0 1 0 2.7L8 19l-4 1z"/><path d="M14.5 6.5l3 3"/>'),
  lantern:I('<path d="M12 3v2"/><path d="M8.5 5h7"/><path d="M9 5c-2 1.6-3 3.8-3 6.5S7 16.4 9 18h6c2-1.6 3-3.8 3-6.5S17 6.6 15 5"/><path d="M9 18h6v2H9z"/>'),
  check:I('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
  shield:I('<path d="M12 3l7 2.8v5.4c0 4.4-3 8.1-7 9.8-4-1.7-7-5.4-7-9.8V5.8L12 3z"/><path d="M9.2 12l2 2 3.6-3.8"/>'),
  lock:I('<rect x="5.5" y="10.5" width="13" height="9" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/>'),
  retry:I('<path d="M4.5 12a7.5 7.5 0 1 1 2.2 5.3"/><path d="M4.5 17.5V12H10"/>'),
  save:I('<path d="M12 4v10"/><path d="M8 10.5l4 3.5 4-3.5"/><path d="M5 19.5h14"/>'),
  heart:I('<path d="M12 19.5C7 15.8 4 12.9 4 9.6A3.9 3.9 0 0 1 8 5.7c1.6 0 3 .8 4 2.2 1-1.4 2.4-2.2 4-2.2a3.9 3.9 0 0 1 4 3.9c0 3.3-3 6.2-8 9.9z"/>'),
  chat:I('<path d="M4.5 6.5A2.5 2.5 0 0 1 7 4h10a2.5 2.5 0 0 1 2.5 2.5v7A2.5 2.5 0 0 1 17 16H9.5L5.5 19.5c-.6.5-1-.1-1-.7V6.5z"/>'),
};
const deitySvg={seongju:ICONS.house,jowang:ICONS.flame,samsin:ICONS.sprout};

/* hero illustration — imagery palette only (hanji/persimmon/ink/pine) */
const heroArt=`
<svg width="150" height="132" viewBox="0 0 150 132" fill="none" aria-hidden="true">
  <circle cx="75" cy="64" r="56" fill="#FFFFFF"/>
  <rect x="49" y="30" width="52" height="72" rx="5" fill="#F1E6D4" stroke="#4A4038" stroke-width="2.4"/>
  <rect x="57" y="40" width="36" height="24" rx="2.5" fill="none" stroke="#4A4038" stroke-width="1.6" opacity=".45"/>
  <rect x="57" y="70" width="36" height="24" rx="2.5" fill="none" stroke="#4A4038" stroke-width="1.6" opacity=".45"/>
  <circle cx="91" cy="67" r="2.6" fill="#4A4038"/>
  <path d="M30 102h90" stroke="#4A4038" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="117" cy="43" r="7" fill="#C97B4A"/>
  <path d="M117 30v-5M128 47h5M125.5 34.5l3.5-3.5" stroke="#C97B4A" stroke-width="2" stroke-linecap="round"/>
  <path d="M36 84c4-2 7-6 8-11 1 5 4 9 8 11-4 2-7 6-8 11-1-5-4-9-8-11z" fill="#6B7F6A" opacity=".8"/>
</svg>`;

/* talisman illustration — imagery palette only */
const talismanArt=`

function topbar(backGo,ctx,home){return `<div class="topbar">${backGo?`<button class="icon-btn" data-go="${backGo}" aria-label="${home?'홈으로':'뒤로'}">${home?ICONS.home:ICONS.back}</button>`:'<span style="width:44px"></span>'}<span class="ctx">${ctx||''}</span></div>`}
function cta(label,go,opts={}){return `<div class="cta-bar"><button class="btn btn-cta btn-primary" ${opts.disabled?'disabled':''} ${go?`data-go="${go}"`:''} ${opts.toast?`data-toast="${opts.toast}"`:''}>${label}</button></div>`}

function deityCard(id,tags,line){const d=deityMap[id];return `<div class="deity-card tap" data-go="deityDetail" data-deity="${id}" role="button" tabindex="0"><span class="ibadge">${deitySvg[id]}</span><div><div class="deity-name">${d.name}</div><div class="deity-fit">${tags}</div><div class="deity-role">${d.role}</div><div class="line-sample">“${line}”</div></div></div>`}
function sampleLine(id){return{seongju:'“관계를 지키는 일과 나를 지우는 일은 달라요.”',jowang:'“오늘은 큰 불을 피우지 않아도 돼요. 꺼지지 않을 만큼만 데워봐요.”',samsin:'“아가, 처음부터 열매를 보려 하지 말고 씨앗 하나만 손에 쥐어보자.”'}[id]}
function sampleConcerns(id){return{seongju:'“내가 예민한 건지 모르겠어요.”<br>“서운한데 말하면 관계가 어색해질까 봐 못 말하겠어요.”',jowang:'“계속 미루기만 해요.”<br>“생활 리듬이 무너졌는데 다시 시작하기가 어려워요.”',samsin:'“시작하고 싶은데 자꾸 겁나요.”<br>“잘 안 될 것 같아서 계속 미루고 있어요.”'}[id]}
function symbolWords(id){return{seongju:'문지방, 작은 등불, 닫히지 않은 문, 내 마음이 머물 자리',jowang:'작은 불씨, 솥, 따뜻한 김, 꺼지지 않는 온기',samsin:'씨앗, 보따리, 실, 아직 열리지 않은 새싹'}[id]}

const nav=document.getElementById('nav'),screenEl=document.getElementById('screen'),toast=document.getElementById('toast'),toastMsg=document.getElementById('toastMsg');
function renderNav(activeId){
  const main=screens.filter(s=>s.group==='main'),exc=screens.filter(s=>s.group==='exception');
  nav.innerHTML=main.map((s,i)=>`<button class="${s.id===activeId?'active':''}" data-nav="${s.id}"><em>${String(i+1).padStart(2,'0')}</em>${s.title}</button>`).join('')
    +'<span class="sep">예외</span>'
    +exc.map(s=>`<button class="${s.id===activeId?'active':''}" data-nav="${s.id}">${s.title}</button>`).join('');
  nav.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>render(b.getAttribute('data-nav'))));
}
let autoTimer=null;
function render(id='landing'){
  const s=screens.find(x=>x.id===id)||screens[0];
  renderNav(s.id);
  screenEl.innerHTML=s.body();
  screenEl.scrollTop=0;
  wire();
  if(autoTimer){clearTimeout(autoTimer);autoTimer=null}
  const next={loading:'result',talismanLoading:'talisman'}[s.id];
  if(next){autoTimer=setTimeout(()=>render(next),1700)}
}
function showToast(msg){toastMsg.textContent=msg;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),2200)}
function wire(){
  screenEl.querySelectorAll('[data-go],[data-toast]').forEach(el=>{
    el.addEventListener('click',()=>{
      const deity=el.getAttribute('data-deity');if(deity)appState.selectedDeity=deity;
      if(el.getAttribute('data-flow')==='worry')appState.selectedDeity=null;
      const msg=el.getAttribute('data-toast');if(msg)showToast(msg);
      const target=el.getAttribute('data-go');if(target)render(target);
    });
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}});
  });
  screenEl.querySelectorAll('.chip').forEach(ch=>ch.addEventListener('click',e=>{e.stopPropagation();ch.classList.toggle('active')}));
  screenEl.querySelectorAll('.score button').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();btn.closest('.score').querySelectorAll('button').forEach(b=>b.classList.remove('on'));btn.classList.add('on')}));
}
render('landing');
</script>
