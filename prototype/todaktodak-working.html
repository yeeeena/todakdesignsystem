<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>토닥토닥 — 작업본</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
/* ============================================================
   토닥토닥 brand tokens — warm mono (Cream · Charcoal · Off-White)
   구조는 TDS(v1) 그대로, 색만 교체
   ============================================================ */
:root{
  /* primary */
  --cream:    #f7f4ed;   /* page background */
  --surface:  #FFFDFC;   /* card/button surfaces */
  --charcoal: #1c1c1c;   /* primary text, headings, dark buttons — not pure black */
  --offwhite: #fcfbf8;   /* text on dark, subtle highlight */
  /* neutral scale (opacity-based) */
  --ink-83: rgba(28,28,28,0.83);   /* strong secondary text */
  --ink-82: rgba(28,28,28,0.82);   /* body copy */
  --muted:  #5f5f5d;               /* secondary text, descriptions, captions */
  --ink-40: rgba(28,28,28,0.40);   /* interactive borders, button outlines */
  --ink-08: rgba(28,28,28,0.08);   /* hairline dividers (derived from scale) */
  --ink-04: rgba(28,28,28,0.04);   /* subtle hover bg, micro-tints */
  --ink-03: rgba(28,28,28,0.03);   /* barely-visible overlays, bg depth */
  /* ===== SEED Design 역할 토큰 (당근 seed-design) — 값은 토닥토닥 브랜드 확정색 ===== */
  /* fg */
  --seed-color-fg-neutral:          var(--charcoal);
  --seed-color-fg-neutral-muted:    var(--ink-82);
  --seed-color-fg-neutral-subtle:   var(--muted);
  --seed-color-fg-neutral-inverted: var(--offwhite);
  --seed-color-fg-brand:            var(--charcoal);   /* 모노 브랜드 */
  --seed-color-fg-critical:         oklch(0.628 0.218 22);
  --seed-color-fg-warning:          oklch(0.748 0.183 56);
  /* bg */
  --seed-color-bg-brand-solid:          var(--charcoal);
  --seed-color-bg-brand-solid-pressed:  #33302a;   /* 참고값 — 실제 pressed는 overlay 방식 */
  --seed-color-bg-neutral-solid:        var(--surface);
  --seed-color-bg-neutral-weak:         var(--ink-04);
  --seed-color-bg-critical-weak:        oklch(0.965 0.02 22);
  --seed-color-bg-warning-weak:         oklch(0.968 0.025 80);
  /* stroke */
  --seed-color-stroke-brand-solid:      var(--charcoal);
  --seed-color-stroke-neutral:          var(--ink-08);   /* [확장] SEED 문서 외 — 네이밍 규칙 준수 */
  --seed-color-stroke-neutral-strong:   var(--ink-40);   /* [확장] */
  /* layer/overlay [확장] */
  --seed-color-bg-layer-default:        var(--cream);
  --seed-color-bg-layer-fill:           var(--ink-03);
  --seed-color-bg-overlay:              rgba(0,0,0,0.56);
  /* legacy TDS token names → new palette (컴포넌트 CSS 호환 유지) */
  --blue-500: var(--seed-color-stroke-brand-solid);
  --blue-600: var(--charcoal);
  --blue-700: var(--charcoal);
  --blue-50:  var(--seed-color-bg-neutral-weak);
  --grey-900: var(--seed-color-fg-neutral);
  --grey-800: var(--ink-83);
  --grey-700: var(--seed-color-fg-neutral-muted);
  --grey-600: var(--seed-color-fg-neutral-subtle);
  --grey-500: var(--seed-color-fg-neutral-subtle);
  --grey-400: var(--seed-color-stroke-neutral-strong);
  --grey-300: var(--seed-color-stroke-neutral-strong);
  --grey-200: var(--seed-color-stroke-neutral);
  --grey-100: var(--seed-color-bg-neutral-weak);
  --grey-50:  var(--seed-color-bg-layer-fill);
  --white: var(--seed-color-bg-neutral-solid);
  /* semantic — 안전/실패 화면 전용으로만 유지 */
  --red-500:    oklch(0.628 0.218 22);
  --green-500:  var(--seed-color-fg-neutral);   /* mono: 완료 체크도 차콜 */
  --orange-500: oklch(0.748 0.183 56);
  --yellow-500: var(--seed-color-bg-layer-default);
  --yellow-300: var(--seed-color-bg-layer-default);
  --orange-300: var(--seed-color-bg-layer-default);
  /* alpha */
  --fg-tertiary:   var(--seed-color-fg-neutral-subtle);
  --fg-quaternary: var(--seed-color-stroke-neutral-strong);
  --line-subtle:   var(--seed-color-bg-layer-fill);
  --bg-overlay:    rgba(0,0,0,0.56);
  --press-overlay: rgba(0,0,0,0.26);
  --disabled-opacity: 0.30;
  /* semantic alias */
  --fill-brand: var(--seed-color-bg-brand-solid);
  --fill-secondary: var(--seed-color-bg-neutral-weak);
  --text-primary: var(--seed-color-fg-neutral);
  --text-secondary: var(--seed-color-fg-neutral-muted);
  --text-brand: var(--seed-color-fg-brand);
  --border-secondary: var(--seed-color-stroke-neutral);
  /* radius ladder */
  --r-s:8px; --r-m:12px; --r-l:14px; --r-xl:16px; --r-2xl:20px; --r-3xl:24px; --r-4xl:32px; --r-full:999px;
  /* elevation — neutral */
  --shadow-2: 0 4px 12px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-3: 0 12px 32px rgba(0,0,0,0.10), 0 2px 6px rgba(0,0,0,0.06);
  --shadow-toast: 0 8px 24px rgba(0,0,0,0.16);
  /* motion */
  --ease: cubic-bezier(0.22,0.61,0.36,1);
  --ease-out: cubic-bezier(0.16,1,0.3,1);
  --dur-fast:120ms; --dur-base:200ms; --dur-slow:320ms;
  --phone-w:390px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:#efece3; color:var(--text-primary);
  letter-spacing:-0.005em;
  -webkit-font-smoothing:antialiased;
}

/* ---------- prototype chrome (제품 아님) ---------- */
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
.proto-head{display:flex;align-items:baseline;gap:10px;margin:4px 2px 14px;flex-wrap:wrap}
.proto-head h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-0.01em}
.proto-head span{font-size:12px;color:var(--grey-500);font-weight:500}
.navchips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.navchips::-webkit-scrollbar{display:none}
.navchips button{
  flex:0 0 auto;height:34px;padding:0 13px;border-radius:var(--r-full);
  border:1px solid var(--border-secondary);background:var(--white);
  font-size:13px;font-weight:600;color:var(--text-secondary);cursor:pointer;
  font-family:inherit;letter-spacing:-0.005em;line-height:1;
  transition:background var(--dur-base) var(--ease),color var(--dur-base) var(--ease);
  display:inline-flex;align-items:center;gap:6px;
}
.navchips button em{font-style:normal;font-size:11px;font-weight:600;color:var(--grey-400)}
.navchips button.active{background:var(--grey-900);border-color:var(--grey-900);color:#fff}
.navchips button.active em{color:oklch(1 0 0 / .55)}
.navchips .sep{flex:0 0 auto;align-self:center;font-size:11px;color:var(--grey-400);font-weight:600;padding:0 4px}
.stage{display:flex;justify-content:center}

/* ---------- phone frame ---------- */
.phone{
  width:var(--phone-w);height:844px;background:var(--seed-color-bg-layer-default);
  border:8px solid var(--charcoal);border-radius:44px;
  box-shadow:var(--shadow-3);overflow:hidden;position:relative;
}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:24px;background:var(--charcoal);border-radius:0 0 16px 16px;z-index:9}

/* ---------- screen scaffold ---------- */
.screen{height:100%;overflow-y:auto;display:flex;flex-direction:column;background:var(--seed-color-bg-layer-default);scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.body{flex:1;padding:0 24px 8px;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:5;flex:0 0 auto;
  height:56px;margin-top:28px;padding:0 8px;
  display:flex;align-items:center;justify-content:space-between;background:var(--seed-color-bg-layer-default);
}
.icon-btn{
  width:40px;height:40px;border:0;background:transparent;border-radius:var(--r-m);
  display:grid;place-items:center;cursor:pointer;color:var(--grey-800);
}
.icon-btn svg{width:24px;height:24px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:active{background:var(--grey-100)}
.topbar .ctx{font-size:13px;font-weight:600;color:var(--fg-tertiary);padding:0 12px}

/* ---------- typography (TDS ramp) ---------- */
.h-page{font-size:24px;line-height:1.3;letter-spacing:-0.02em;font-weight:700;margin:8px 0 8px;color:var(--text-primary)}
.lead{font-size:15px;line-height:1.5;letter-spacing:-0.005em;color:var(--text-secondary);margin:0 0 20px;font-weight:400}
.caption{font-size:12px;line-height:1.4;font-weight:500;color:var(--fg-tertiary);margin:10px 0 0}
.section-title{font-size:14px;line-height:1.3;font-weight:600;color:var(--text-primary);margin:26px 0 10px}
.info-svg{width:15px;height:15px;margin-right:6px;vertical-align:-3px;color:var(--seed-color-fg-neutral-subtle)}
.bottom-bar{position:sticky;bottom:0;z-index:6;display:flex;flex-direction:column;gap:12px;margin-top:auto;padding:12px 24px 20px;background:var(--seed-color-bg-layer-default);border-top:1px solid var(--seed-color-stroke-neutral)}
.bb-btns{display:flex;gap:12px}
.bb-btns .btn{flex:1;height:52px;border-radius:12px;font-size:16px;font-weight:700} /* SEED large 지오메트리 + t5 예외 */
.bb-btns .btn+.btn{margin-top:0} /* .btn+.btn 세로 마진 규칙 무효화 — 가로 배치 틀어짐 방지 */
.deity-fit{font-size:12px;line-height:1.45;color:var(--seed-color-fg-neutral-subtle);font-weight:500;margin-bottom:4px}
h3{font-size:17px;line-height:1.45;font-weight:600;margin:0 0 6px;letter-spacing:-0.01em}

/* ---------- buttons ---------- */
.btn{
  position:relative;overflow:hidden;isolation:isolate;
  display:flex;align-items:center;justify-content:center;width:100%;
  border:0;cursor:pointer;font-family:inherit;letter-spacing:-0.005em;
  transition:background var(--dur-fast) var(--ease);
}
.btn::after{content:"";position:absolute;inset:0;background:var(--press-overlay);opacity:0;transition:opacity var(--dur-fast) var(--ease)}
.btn:active::after{opacity:1}
.btn-xl{height:52px;border-radius:12px;font-size:18px;font-weight:700;line-height:1.33} /* SEED ActionButton large: x13(52) · r3(12) · t6(18) */
.btn-l{height:52px;border-radius:12px;font-size:18px;font-weight:700;line-height:1.33} /* SEED large */
.btn-m{height:40px;border-radius:8px;font-size:14px;font-weight:700;line-height:1.36} /* SEED medium: x10(40) · r2(8) · t4(14) */
.btn-primary{background:var(--fill-brand);color:var(--seed-color-fg-neutral-inverted)}
.btn-primary::after{background:rgba(252,251,248,.16)} /* 다크 버튼 pressed는 밝은 오버레이 */
.btn-secondary{background:var(--seed-color-bg-neutral-solid);color:var(--text-primary);box-shadow:inset 0 0 0 1px var(--seed-color-stroke-neutral-strong)}
.btn-ghost{background:transparent;color:var(--text-brand)}
.btn-ghost::after{background:oklch(0 0 0 / 0.06)}
.btn[disabled]{opacity:var(--disabled-opacity);pointer-events:none}
.btn + .btn{margin-top:10px}
.btn-row{display:flex;gap:9px}.btn-row .btn{flex:1;font-size:16px}.btn-row .btn+.btn{margin-top:0} /* 페어 버튼은 t5(16) — 긴 한글 라벨 줄바꿈 방지 */

/* bottom CTA — 보호 그라디언트(문서화된 예외 1) */
.cta-bar{
  position:sticky;bottom:0;z-index:6;flex:0 0 auto;
  margin:auto 0 0;padding:28px 24px 20px; /* 양옆 24px 공통 마진 — .screen 직속 배치 기준 */
  background:linear-gradient(180deg, rgba(247,244,237,0) 0, var(--seed-color-bg-layer-default) 26px);
}
.cta-stack{display:flex;flex-direction:column;gap:12px}
.cta-stack .btn+.btn{margin-top:0}

/* ---------- cards ---------- */
.card{background:var(--white);border:1px solid var(--border-secondary);border-radius:var(--r-xl);padding:18px;margin:0 0 12px}
.card-soft{background:var(--grey-50);border-color:transparent}
.card-brand{background:var(--blue-50);border-color:transparent}
.mini-title{font-size:13px;line-height:1.25;font-weight:600;color:var(--fg-tertiary);margin:0 0 8px}
.card-brand .mini-title{color:var(--text-brand)}
.body-text{font-size:15px;line-height:1.5;letter-spacing:-0.005em;margin:0;color:var(--text-primary)}
.body-text .dim{color:var(--fg-tertiary);font-size:13px}
.quote{font-size:17px;line-height:1.5;font-weight:600;letter-spacing:-0.01em;margin:0;color:var(--text-primary)}
.big-quote{font-size:20px;line-height:1.45;font-weight:700;letter-spacing:-0.015em;margin:0;color:var(--text-primary)}
.card.tappable{cursor:pointer;transition:background var(--dur-base) var(--ease)}
.card.tappable:active{background:var(--grey-50)}

/* ---------- hero (landing) ---------- */
.hero{
  border-radius:var(--r-3xl);background:var(--grey-50);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:216px;margin:6px 0 22px;
}
.mascot{width:104px;height:104px;border-radius:var(--r-4xl);background:var(--white);border:1px solid var(--border-secondary);display:grid;place-items:center;font-size:52px}
.mascot-title{font-size:13px;color:var(--text-secondary);font-weight:600;margin-top:12px}

/* ---------- entry choices ---------- */
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 8px}
.entry-choice{
  border:1px solid var(--border-secondary);background:var(--white);border-radius:var(--r-2xl);
  padding:18px 16px;min-height:136px;text-align:left;cursor:pointer;font-family:inherit;color:var(--text-primary);
  transition:background var(--dur-base) var(--ease);letter-spacing:-0.005em;
}
.entry-choice:active{background:var(--grey-50)}
.entry-choice b{display:block;font-size:16px;font-weight:700;line-height:1.3;margin-bottom:8px;letter-spacing:-0.01em}
.entry-choice p{font-size:13px;line-height:1.5;color:var(--text-secondary);margin:0;font-weight:400}
.entry-choice .glyph{font-size:22px;display:block;margin-bottom:10px}

/* ---------- chips (34px full pill) ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  min-height:36px;padding:8px 14px;border-radius:var(--r-full);
  border:1px solid var(--seed-color-stroke-neutral);background:var(--seed-color-bg-neutral-solid);
  font-size:14px;font-weight:500;color:var(--text-primary);cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;letter-spacing:-0.005em;
  transition:background var(--dur-base) var(--ease),color var(--dur-base) var(--ease),border-color var(--dur-base) var(--ease);
}
.chip.active{background:var(--seed-color-bg-brand-solid);border-color:var(--seed-color-bg-brand-solid);color:var(--seed-color-fg-neutral-inverted);font-weight:700} /* SEED selected=bold */

/* ---------- textarea (text-field 규칙) ---------- */
textarea{
  width:100%;min-height:136px;border:1px solid var(--seed-color-stroke-neutral);border-radius:var(--r-xl);
  background:var(--seed-color-bg-neutral-solid);padding:16px;font-family:inherit;
  font-size:15px;line-height:1.55;letter-spacing:-0.005em;color:var(--text-primary);
  resize:none;outline:0;transition:border-color var(--dur-base) var(--ease);
}
textarea::placeholder{color:var(--fg-quaternary)}
textarea:focus{border:2px solid var(--seed-color-stroke-brand-solid)} /* SEED text-input focus */

/* ---------- deity list ---------- */
.deity-card{
  display:grid;grid-template-columns:48px 1fr;gap:14px;align-items:start;
  background:var(--white);border:1px solid var(--border-secondary);border-radius:var(--r-2xl);
  padding:16px;margin:0 0 12px;cursor:pointer;transition:background var(--dur-base) var(--ease);
}
.deity-card:active{background:var(--grey-50)}
.symbol{width:48px;height:48px;border-radius:var(--r-l);background:var(--seed-color-bg-neutral-weak);display:grid;place-items:center;font-size:24px;overflow:hidden;flex:0 0 auto}
.symbol img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.deity-name{font-size:17px;font-weight:700;letter-spacing:-0.01em;margin-bottom:2px}
.deity-role{font-size:13px;line-height:1.5;color:var(--text-secondary);margin-bottom:10px}
.line-sample{font-size:14px;line-height:1.55;font-weight:600;background:var(--grey-50);border-radius:var(--r-m);padding:11px 13px;color:var(--text-primary)}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 8px}
.badge{height:22px;padding:0 8px;border-radius:6px;background:var(--blue-50);color:var(--text-brand);font-size:11px;font-weight:600;display:inline-flex;align-items:center}
.selected-deity{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--blue-50);border-radius:var(--r-l);padding:12px 14px;margin:2px 0 16px;
}
.selected-deity strong{font-size:13px;font-weight:600;color:var(--text-brand)}
.selected-deity button{border:0;background:transparent;color:var(--text-brand);font-weight:600;font-size:12px;cursor:pointer;font-family:inherit;flex:0 0 auto;opacity:.75}

/* ---------- progress ---------- */
.progress{height:4px;background:var(--grey-200);border-radius:var(--r-full);margin:4px 0 20px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--fill-brand);border-radius:var(--r-full);transition:width var(--dur-slow) var(--ease-out)}

/* ---------- loading (3-dot loader — skeleton shimmer 금지) ---------- */
.dots{display:flex;gap:8px;justify-content:center;margin:44px 0 20px}
.dots i{width:10px;height:10px;border-radius:var(--r-full);background:var(--grey-300);animation:dot 1.2s var(--ease) infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.35;transform:none}30%{opacity:1;transform:translateY(-4px);background:var(--blue-500)}}
.checklist{display:grid;gap:8px;margin:14px 0}
.check{display:flex;gap:10px;align-items:center;background:var(--seed-color-bg-neutral-weak);border-radius:var(--r-l);padding:13px 14px;font-size:14px;font-weight:500;color:var(--text-primary);line-height:1.45}
.check .tick{width:20px;height:20px;border-radius:var(--r-full);background:var(--seed-color-bg-brand-solid);color:var(--seed-color-fg-neutral-inverted);display:grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 auto}

/* ---------- talisman art (일러스트 그라디언트 — 문서화된 예외 3) ---------- */
.talisman-art{
  height:250px;border-radius:var(--r-3xl);margin:4px 0 14px;
  background:#eee9dc; /* mono: 플랫 페이퍼 톤 */
  display:grid;place-items:center;position:relative;overflow:hidden;
}
.talisman-art .frame{
  width:158px;height:192px;background:rgba(252,251,248,.92);border-radius:var(--r-xl);
  display:grid;place-items:center;box-shadow:var(--shadow-2);
}
.talisman-art .frame span{writing-mode:vertical-rl;font-size:16px;font-weight:700;letter-spacing:0.14em;color:var(--grey-800)}

/* ---------- score ---------- */
.score{display:flex;gap:8px;margin-top:12px}
.score button{
  flex:1;height:40px;border-radius:var(--r-full);border:1px solid var(--seed-color-stroke-neutral-strong);
  background:var(--seed-color-bg-neutral-solid);font-size:15px;font-weight:600;color:var(--text-secondary);cursor:pointer;font-family:inherit;
  transition:background var(--dur-base) var(--ease);
}
.score button.on{background:var(--blue-50);border-color:var(--blue-500);color:var(--text-brand);font-weight:700}

/* ---------- toast ---------- */
.toast{
  position:absolute;bottom:22px;left:20px;right:20px;z-index:20;
  background:var(--grey-900);color:#fff;border-radius:var(--r-l);
  padding:14px 16px;font-size:14px;font-weight:500;line-height:1.45;
  box-shadow:var(--shadow-toast);display:flex;gap:10px;align-items:center;
  opacity:0;transform:translateY(8px);pointer-events:none;
  transition:opacity var(--dur-slow) var(--ease-out),transform var(--dur-slow) var(--ease-out);
}
.toast.show{opacity:1;transform:none}
.toast .tick{width:20px;height:20px;border-radius:var(--r-full);background:var(--seed-color-fg-neutral-inverted);color:var(--charcoal);display:grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 auto}

/* ---------- loading — figma 183:3050 반영: 차오르는 링 + 신 이미지 순환 ---------- */
.loader-wrap{position:relative;width:160px;height:160px;margin:32px auto 30px;flex:0 0 auto;align-self:center}
.loader-ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)} /* 12시 방향 시작 */
.loader-ring circle:last-child{stroke-dasharray:534.07;stroke-dashoffset:534.07;animation:ringFill 4.6s linear forwards}
@keyframes ringFill{to{stroke-dashoffset:0}}
.loader-avatar{position:absolute;inset:11px;border-radius:999px;overflow:hidden;background:#e9e6df}
.loader-avatar img{width:100%;height:100%;object-fit:cover;display:block}
@media(prefers-reduced-motion:reduce){.loader-ring circle:last-child{animation:none;stroke-dashoffset:0}}

/* ---------- talisman flip — figma 183:3186(앞)/183:3455(뒤) ---------- */
.sub-text{font-size:14px;line-height:1.6;margin:0;color:var(--text-secondary)}
.flip-scene{perspective:1400px;width:316px;margin:0 auto}
.flip-card{
  position:relative;width:316px;height:498px;cursor:pointer;
  transform-style:preserve-3d;
  transition:transform 640ms cubic-bezier(.2,.7,.3,1);
}
.flip-card.flipped{transform:rotateY(180deg)}
.flip-face{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:var(--shadow-2);display:block;
}
.flip-back{transform:rotateY(180deg)}
/* 진입 힌트 — 첫 1회, 살짝 기울었다 돌아오며 "뒤집힌다"는 걸 알려줌 */
.flip-card.peek{animation:peek 1.1s .9s var(--ease) 1}
@keyframes peek{0%,100%{transform:rotateY(0)}35%{transform:rotateY(-20deg)}}
.flip-hint{font-size:12px;font-weight:500;color:var(--seed-color-fg-neutral-subtle);text-align:center;margin:12px 0 0}
@media(prefers-reduced-motion:reduce){.flip-card{transition:none}.flip-card.peek{animation:none}}

/* ---------- landing — figma 173:2202 반영 ---------- */
.landing{flex:1;display:flex;flex-direction:column;padding:56px 24px 28px;background:var(--seed-color-bg-layer-default) url('assets/landing-bg@4x.png') center / cover no-repeat}
.landing-title{font-size:24px;line-height:1.35;letter-spacing:-0.02em;font-weight:700;color:var(--text-primary);text-align:center;margin:0 0 12px}
.landing-lead{font-size:15px;line-height:1.4;font-weight:600;color:var(--ink-83);text-align:center;margin:0}
.landing-spacer{flex:1}
.landing-btns{display:flex;gap:10px}
.btn-pill{flex:1;height:52px;border-radius:12px;background:var(--seed-color-bg-neutral-solid);border:1px solid var(--seed-color-stroke-brand-solid);font-family:inherit;font-size:16px;font-weight:700;color:var(--text-primary);cursor:pointer;transition:background var(--dur-fast) var(--ease)}
.btn-pill:active{background:#f1ede4}
.landing-link{border:0;background:transparent;margin:22px auto 0;padding:8px;font-family:inherit;font-size:14px;font-weight:600;color:var(--text-primary);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.landing-caption{font-size:12px;line-height:1.6;font-weight:500;color:var(--seed-color-fg-neutral-subtle);text-align:center;margin:8px 0 0}

.divider{height:1px;background:var(--border-secondary);margin:24px -24px}
.spacer{flex:1}

@media(max-width:520px){
  .wrap{padding:12px 10px 32px}
  .phone{width:100%;max-width:390px;height:800px}
}

<body>
<div class="wrap">
  <div class="proto-head"><h1>토닥토닥 · 작업본</h1><span>v1 구조 × Cream/Charcoal 브랜드 팔레트 — 390px</span></div>
  <div class="navchips" id="nav"></div>
  <div class="stage">
    <div class="phone">
      <div class="notch"></div>
      <div class="screen" id="screen"></div>
      <div class="toast" id="toast"><span class="tick">✓</span><span id="toastMsg"></span></div>
    </div>

</div>

<script>
let appState={selectedDeity:null};
// 6신 체계 — 산신·칠성신 한마디는 피그마 부적 카드 카피, 나머지 카피는 동일 톤 초안(수정 대상)
const deityMap={
  seonang:{name:'서낭신',label:'서낭신에게 고민을 건네고 있어요',icon:'assets/deities/서낭신.png',role:'마을 어귀에서 오가는 관계를 지켜보는 신'},
  sansin:{name:'산신',label:'산신과 함께 이 고민을 정리해볼게요',icon:'assets/deities/산신.png',role:'흔들리지 않는 걸음과 마음의 중심을 지키는 신'},
  samsin:{name:'삼신할미',label:'삼신할미에게 시작 앞의 마음을 건네고 있어요',icon:'assets/deities/삼신할미.png',role:'새로 시작하고 싶은 마음을 조심스럽게 돌보는 신'},
  munsin:{name:'문신',label:'문신에게 고민을 건네고 있어요',icon:'assets/deities/문신.png',role:'열 문과 닫을 문을 가려 내 경계를 지키는 신'},
  yongwang:{name:'용왕',label:'용왕에게 마음의 파도를 건네고 있어요',icon:'assets/deities/용왕.png',role:'출렁이는 감정의 물결을 가라앉히는 신'},
  chilseong:{name:'칠성신',label:'칠성신에게 오래 품은 걱정을 건네고 있어요',icon:'assets/deities/칠성신.png',role:'어두운 밤에도 방향을 잃지 않게 별을 밝히는 신'}
};
const backSvg='<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>';
const homeSvg='<svg viewBox="0 0 24 24"><path d="M3 11.5L12 4l9 7.5"/><path d="M5.5 10v9h13v-9"/></svg>';
function topbar(backGo,ctx,home){return `<div class="topbar">${backGo?`<button class="icon-btn" data-go="${backGo}">${home?homeSvg:backSvg}</button>`:'<span style="width:40px"></span>'}<span class="ctx">${ctx||''}</span></div>`}
function cta(label,go,opts={}){return `<div class="cta-bar"><button class="btn btn-xl btn-primary" ${opts.disabled?'disabled':''} ${go?`data-go="${go}"`:''} ${opts.toast?`data-toast="${opts.toast}"`:''}>${label}</button></div>`}

const screens=[
{id:'landing',title:'시작 화면',group:'main',body:()=>`
  <div class="landing">
    <h2 class="landing-title">오늘 마음에 걸리는 일이 있나요?</h2>
    <p class="landing-lead">고민을 적으면 토착신이 지금 마음을 읽고,<br>오늘 해볼 작은 실천을 건네드려요.<br>원한다면 그 결과를 나만의 부적으로 남길 수 있어요.</p>
    <div class="landing-spacer"></div>
    <div class="landing-btns">
      <button class="btn-pill" data-go="input" data-flow="worry">고민부터 시작하기</button>
      <button class="btn-pill" data-go="deities">토착신 먼저보기</button>
    </div>
    <button class="landing-link" data-toast="고민 입력 → 토착신 해석 → 오늘 해볼 작은 실천 → 원하면 부적 생성 순서로 진행돼요.">이 서비스는 어떻게 진행되나요?</button>
    <p class="landing-caption">미래를 맞히거나 결정을 대신하는 서비스가 아니라,<br>오늘의 고민을 정리하기 위한 참고예요.</p>
  </div>`},
{id:'deities',title:'토착신 리스트',group:'main',body:()=>`
  ${topbar('landing','')}
  <div class="body">
    <h2 class="h-page">어떤 토착신에게<br>고민을 건네볼까요?</h2>
    <p class="lead">무엇을 기준으로 고르면 좋을지 먼저 보여드릴게요. 토착신을 골라도 결과 전에는 고민 입력이 필요해요.</p>
    ${deityCard('seonang','관계 · 서운함 · 소속감 · 사람에 지침','“오가는 사람을 다 붙잡는 나무는 없어요. 지나갈 사람은 보내줘도 돼요.”')}
    ${deityCard('sansin','번아웃 · 조급함 · 페이스 · 중심 잡기','“급히 오를수록 쉽게 엎어져. 흔들리지 않게 딛는 한 걸음이 먼저다.”')}
    ${deityCard('samsin','시작 · 변화 · 용기 · 자기비난','“처음부터 열매를 보려 하지 말고 씨앗 하나만 쥐어보자.”')}
    ${deityCard('munsin','거절 · 경계 · 내 공간 · 부탁 부담','“모든 문을 다 열어줄 필요는 없어요. 어떤 문은 닫아두는 게 지키는 거예요.”')}
    ${deityCard('yongwang','감정 기복 · 불안 · 눈물 · 마음의 파도','“파도는 막는 게 아니라, 지나가게 두는 거예요.”')}
    ${deityCard('chilseong','막막함 · 장래 불안 · 오래 품은 걱정','“오늘 다 해결하지 않아도 괜찮아. 별은 어두워진 뒤에야 보이는 법이니까.”')}
    <button class="landing-link" data-go="input" data-flow="worry" style="margin-top:16px">고민부터 먼저 적을래요</button>
  </div>`},
{id:'deityDetail',title:'토착신 상세',group:'main',body:()=>{const id=appState.selectedDeity||'seonang';const d=deityMap[id];return `
  ${topbar('deities','')}

    <div class="symbol" style="width:72px;height:72px;border-radius:var(--r-3xl);margin:2px 0 18px"><img src="${d.icon}" alt="${d.name}"></div>
    <h2 class="h-page">${d.name}은 이런 고민에<br>잘 맞아요</h2>
    <p class="lead">${d.role}. 선택 후에는 고민을 입력해야 상담 결과를 받을 수 있어요.</p>
    <div class="card"><div class="mini-title">말투 미리보기</div><p class="quote" style="font-size:15px">${sampleLine(id)}</p></div>
    <div class="card"><div class="mini-title">많이 건네는 고민</div><p class="quote" style="font-size:15px">${sampleConcerns(id)}</p></div>
    <div class="card"><div class="mini-title">부적에 자주 담기는 상징</div><p class="body-text">${symbolWords(id)}</p></div>
  </div>
  <div class="cta-bar cta-stack">
    <button class="btn btn-xl btn-secondary" data-go="deities">다른 토착신 보기</button>
    <button class="btn btn-xl btn-primary" data-go="input">${d.name}에게 고민 말하기</button>
  </div>`}},
{id:'input',title:'공통 고민 입력',group:'main',body:()=>{const d=appState.selectedDeity?deityMap[appState.selectedDeity]:null;return `
  ${topbar('landing','')}
  <div class="body">
    ${d?`<div class="selected-deity"><strong>${d.label}</strong><button data-go="deities">다른 토착신 선택</button></div>`:''}
    <h2 class="h-page">지금 마음에 남아 있는 말을<br>편하게 적어주세요</h2>
    <p class="lead" style="margin-bottom:18px">짧게 적어도 괜찮아요. 한 문장이어도 충분해요.</p>

    <p class="caption"><svg class="info-svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="8" cy="8" r="6.6" stroke-width="1.2"/><circle cx="8" cy="5.1" r="0.9" fill="currentColor" stroke="none"/><path d="M8 7.5v3.6" stroke-width="1.3" stroke-linecap="round"/></svg>실명, 연락처, 주소는 적지 않아도 괜찮아요.</p>
    <div class="section-title">지금 마음에 가까운 감정</div>
    <div class="chips"><button class="chip">서운함</button><button class="chip">불안함</button><button class="chip">막막함</button><button class="chip">화남</button><button class="chip">지침</button><button class="chip">잘 모르겠음</button></div>

    <div class="spacer" style="min-height:24px"></div>
  </div>

    <p class="caption" style="text-align:center;margin:0">고민부터 시작했든, 토착신을 먼저 골랐든<br>여기서부터는 같은 방식으로 진행돼요.</p>
    <div class="bb-btns">
      <button class="btn btn-secondary" data-go="reflect">마음 한번 더 확인하기</button>
      <button class="btn btn-primary" data-go="loading">결과 받아보기</button>

  </div>`}},
{id:'reflect',title:'마음 한 번 더 확인',group:'main',body:()=>`
  ${topbar('input','고민 정리 1/3')}
  <div class="body">
    <div class="progress"><span style="width:33%"></span></div>
    <h2 class="h-page">이 마음이 맞나요?</h2>

{id:'capacity',title:'오늘 가능한 정도',group:'main',body:()=>`
  ${topbar('reflect','고민 정리 2/3')}

    <div class="progress"><span style="width:66%"></span></div>

{id:'summary',title:'정리 확인',group:'main',body:()=>`
  ${topbar('capacity','고민 정리 3/3')}
  <div class="body">
    <div class="progress"><span style="width:100%"></span></div>

{id:'loading',title:'결과 생성 중',group:'main',body:()=>`
  ${topbar(null,'결과 준비 중')}
  <div class="body">

{id:'result',title:'상담 결과',group:'main',body:()=>`
  ${topbar('input','상담 결과')}
  <div class="body">
    <div class="card card-brand" style="padding:20px;border-radius:var(--r-2xl)">
      <div class="mini-title">서낭신이 이렇게 읽었어요</div>
      <p class="big-quote">“관계를 지키려는 마음이 커질수록, 내 마음이 설 자리가 좁아졌을 수 있어요.”</p>

const nav=document.getElementById('nav'),screenEl=document.getElementById('screen'),toast=document.getElementById('toast'),toastMsg=document.getElementById('toastMsg');
function renderNav(activeId){
  const main=screens.filter(s=>s.group==='main'),exc=screens.filter(s=>s.group==='exception');
  nav.innerHTML=main.map((s,i)=>`<button class="${s.id===activeId?'active':''}" data-nav="${s.id}"><em>${String(i+1).padStart(2,'0')}</em>${s.title}</button>`).join('')
    +'<span class="sep">예외</span>'
    +exc.map(s=>`<button class="${s.id===activeId?'active':''}" data-nav="${s.id}">${s.title}</button>`).join('');
  nav.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>render(b.getAttribute('data-nav'))));
}
let autoTimer=null,loaderCycle=null;
function render(id='landing'){
  const s=screens.find(x=>x.id===id)||screens[0];
  renderNav(s.id);
  screenEl.innerHTML=s.body();
  screenEl.scrollTop=0;
  wire();
  if(autoTimer){clearTimeout(autoTimer);autoTimer=null}
  if(loaderCycle){clearInterval(loaderCycle);loaderCycle=null}
  const li=document.getElementById('loaderImg');
  if(li){let i=0;loaderCycle=setInterval(()=>{i=(i+1)%loaderImgs.length;li.src=loaderImgs[i];},1000)}
  const next={loading:'result',talismanLoading:'talisman'}[s.id];
  if(next){autoTimer=setTimeout(()=>render(next),4800)} /* 신 순환이 보이도록 로딩 체류 연장 */
}
function showToast(msg){toastMsg.textContent=msg;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),2000)}
function wire(){
  screenEl.querySelectorAll('[data-go],[data-toast]').forEach(el=>{
    el.addEventListener('click',()=>{
      const deity=el.getAttribute('data-deity');if(deity)appState.selectedDeity=deity;
      if(el.getAttribute('data-flow')==='worry')appState.selectedDeity=null;
      const msg=el.getAttribute('data-toast');if(msg)showToast(msg);
      const target=el.getAttribute('data-go');if(target)render(target);
    });
  });
  screenEl.querySelectorAll('.chip').forEach(ch=>ch.addEventListener('click',e=>{e.stopPropagation();ch.classList.toggle('active')}));
  screenEl.querySelectorAll('.score button').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();btn.closest('.score').querySelectorAll('button').forEach(b=>b.classList.remove('on'));btn.classList.add('on')}));
  /* 부적 flip — 탭/엔터로 앞뒤 전환, 진입 시 1회 peek 힌트 */
  const fc=screenEl.querySelector('#flipCard');
  if(fc){
    fc.classList.add('peek');
    const hint=screenEl.querySelector('#flipHint');
    const flip=()=>{
      fc.classList.remove('peek');
      fc.classList.toggle('flipped');
      if(hint)hint.textContent=fc.classList.contains('flipped')?'다시 탭하면 앞면으로 돌아가요':'부적을 탭하면 뒷면을 볼 수 있어요';
    };
    fc.addEventListener('click',flip);
    fc.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}});
  }
}
render('landing');
</script>
</body>
</html>
